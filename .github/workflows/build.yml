name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  audit:
    name: Source audit and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Audit public source
        run: |
          python3 scripts/test_audit_public.py
          python3 scripts/test_package_release.py
          python3 scripts/test_update_manifest.py
          python3 scripts/test_macos_release.py
          python3 scripts/test_release_policy.py
          python3 scripts/audit_public.py
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all commit history (redacted)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify release versions and merged main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/check_release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

  desktop:
    name: Build ${{ matrix.platform }}
    needs: audit
    # Apple may take several hours to complete a first notarization review.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            platform: windows-x64
            targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_SUPABASE_REDIRECT_URL: ''
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.targets }}
      - run: npm ci
      - run: npm test
      - name: Remove build-machine source paths
        shell: bash
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=$HOME=/build" >> "$GITHUB_ENV"
      - name: Build unsigned development installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') || runner.os != 'macOS' }}
        run: npm run tauri -- build --ci --no-sign ${{ matrix.args }} -- --locked
      - name: Build signed and notarized macOS release
        if: ${{ startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: python3 scripts/build_macos_release.py
      - name: Test native update selection and validation
        run: cargo test ${{ runner.os == 'Windows' && '--release' || '' }} --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Package unsigned CI distributables
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/package_release.py --platform ${{ matrix.platform }}
      - name: Package and sign release updates
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --sign-updates
      - name: Verify packages with the embedded updater public key
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo test ${{ runner.os == 'Windows' && '--release' || '' }} --locked --manifest-path src-tauri/Cargo.toml --lib release_artifacts_match_embedded_key -- --ignored
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notes-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [audit, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: notes-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-assets
        run: |
          sha256sum --check SHA256SUMS-macos-universal.txt
          sha256sum --check SHA256SUMS-windows-x64.txt
      - name: Generate update manifest
        run: python3 scripts/create_update_manifest.py
      - name: Publish only after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            test "$(cat "$RUNNER_TEMP/release-state")" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
            gh release edit "$RELEASE_TAG" --target "$RELEASE_COMMIT" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "纸笺 $RELEASE_TAG — 预览版" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
